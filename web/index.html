<div id="msg" role="status" aria-live="polite">Awakening the abbey…</div>

<script type="module">
  // Start in a demo room with ?room=NAME, or the pavilion with ?scene=world.
  // Messages name the game by the page title (a single-file build may retitle it).
  const name = document.title;
  const msg = document.getElementById('msg');
  if (!navigator.gpu) {
    msg.replaceChildren(`${name} needs WebGPU.`, document.createElement('br'),
      'Open this build in a browser with WebGPU and hardware acceleration, such as Chrome or Edge.');
  } else {
    // The game hides this message once its canvas exists, and takes keyboard focus.
    new MutationObserver((_, obs) => {
      const c = document.querySelector('canvas');
      if (c) { c.setAttribute('aria-label', `${name} game`); msg.remove(); c.focus(); obs.disconnect(); }
    }).observe(document.body, { childList: true });
    // Phones and tablets: the first tap goes full screen and turns sideways, where the browser
    // allows it (Android; an iPhone keeps its bars, or plays full screen from the home screen).
    if (matchMedia('(pointer: coarse)').matches) {
      addEventListener('pointerup', () => {
        const el = document.documentElement;
        if (!document.fullscreenElement && el.requestFullscreen) {
          el.requestFullscreen({ navigationUI: 'hide' })
            .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'))
            .catch(() => {});
        }
      }, { once: true, capture: true });
    }
    try {
      // The game is shardfall.js and its .wasm beside this page. A single-file build
      // (scripts/pack_single_html.py) carries both inside the page and sets window.loadGame.
      if (window.loadGame) await window.loadGame();
      else await (await import('./shardfall.js')).default();
    } catch (error) {
      console.error(`${name} failed to load:`, error);
      msg.textContent = `${name} could not load. Please reload the page. If it still fails, check that WebGPU and hardware acceleration are enabled.`;
      document.body.append(msg);
    }
  }
</script>
